# IguanaXterm with Docker Compose or Podman Compose, on Linux, Windows or
# macOS. Full instructions: INSTALL.md.
#
#   cp .env.example .env        # then set GANXTERM_ADMIN_PASS
#   docker compose up -d --build        (or: podman compose up -d --build)
#   open http://127.0.0.1:8765/iguanaxterm
#
# Folders a browser cannot save itself (Firefox has no folder picker) are
# saved on the server, in the data volume, and listed under "Saved files".
# To have them land in a folder on this computer instead: with Docker, add
# compose.downloads.yaml; with Podman on Linux, use the podman run command in
# INSTALL.md ("Saving folders to this computer").
#
# Two services: IguanaXterm, and guacd (Apache Guacamole's proxy) for RDP
# desktops. guacd has NO login of its own: anyone who can reach its port can
# make it connect anywhere. So it has no `ports:` and is reachable only by
# IguanaXterm over this file's private network. Never publish it.

name: iguanaxterm

services:

  iguanaxterm:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/iguanaxterm:latest
    # It identifies itself as IguanaXterm: container name, hostname, label.
    container_name: iguanaxterm
    hostname: iguanaxterm
    labels:
      app: IguanaXterm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GANXTERM_DATA_DIR: /data
      # The browser-facing origin. Loopback only unless you put TLS in front
      # (INSTALL.md, "Reaching IguanaXterm from other machines").
      GANXTERM_CANONICAL_ORIGIN: ${GANXTERM_CANONICAL_ORIGIN:-http://127.0.0.1:${GANXTERM_PORT:-8765}}
      GANXTERM_ALLOWED_HOSTS: ${GANXTERM_ALLOWED_HOSTS:-}
      # RDP desktops, through the guacd service below. Unset it to switch RDP off.
      GANXTERM_GUACD: ${GANXTERM_GUACD:-guacd:4822}
    depends_on:
      - guacd
    ports:
      # 127.0.0.1 on purpose: pytincture only serves authenticated plain HTTP
      # to a loopback address, and this holds your SSH credentials.
      - "127.0.0.1:${GANXTERM_PORT:-8765}:8765"
    extra_hosts:
      # "host.docker.internal" reaches servers on this computer. Docker Desktop
      # and Podman provide it already; this adds it on Docker Engine (Linux).
      - "host.docker.internal:host-gateway"
    volumes:
      - iguanaxterm-data:/data
    healthcheck:
      test: ["CMD", "python", "manage.py", "health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  guacd:
    # Pinned by version and digest; guacamole-common-js in
    # appcode/vendor/guacamole is the same version. Bump both together.
    image: docker.io/guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    container_name: iguanaxterm-guacd
    hostname: guacd
    labels:
      app: IguanaXterm
    restart: unless-stopped
    # No ports: on purpose (see the top of this file). IguanaXterm's
    # healthcheck stays on the app alone: guacd down disables RDP, nothing else.

volumes:
  iguanaxterm-data:
    # Named explicitly so it is the same whatever folder this was cloned into.
    name: iguanaxterm-data
