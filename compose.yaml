# Local testing with Podman:
#   podman compose up -d          (needs: systemctl --user enable --now podman.socket)
#
# Without compose, which is what scripts/podman-run.sh does:
#   podman build -t localhost/iguanaxterm:latest -f Containerfile .
#   podman run -d --name iguanaxterm ...

services:

  iguanaxterm:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/iguanaxterm:latest
    # The container identifies itself as IguanaXterm in `podman ps`, in its own
    # shell prompt, and in the app's sidebar.
    container_name: iguanaxterm
    hostname: iguanaxterm
    labels:
      app: IguanaXterm
    restart: unless-stopped
    # Podman only. Makes the container's user (uid 10001, gid 999) be you on
    # the host, so files saved into the downloads folder are yours.
    userns_mode: "keep-id:uid=10001,gid=999"
    ports:
      # Loopback only. pytincture refuses authenticated plain HTTP anywhere
      # else, so reaching this from another machine needs TLS and the two
      # variables below.
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    environment:
      - GANXTERM_DATA_DIR=/data
      - GANXTERM_CANONICAL_ORIGIN=${GANXTERM_CANONICAL_ORIGIN:-http://127.0.0.1:8765}
      - GANXTERM_ALLOWED_HOSTS=${GANXTERM_ALLOWED_HOSTS:-}
      - GANXTERM_DOWNLOAD_DIR=/downloads
    volumes:
      # :U re-owns the volume to the mapped user above.
      - ganxterm_data:/data:U
      # Folder downloads a browser cannot write itself (Firefox, or any
      # non-https origin). A dedicated folder: :z relabels it for SELinux.
      - ${GANXTERM_DOWNLOAD_HOST_DIR:-~/Downloads/IguanaXterm}:/downloads:z

volumes:
  # Not iguanaxterm_data: that name is taken by a root-owned volume left over
  # from the abandoned dhxpyt attempt, and this image runs as uid 10001.
  ganxterm_data:
