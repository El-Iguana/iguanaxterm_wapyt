[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iguanaxterm"
version = "2.2.0"
description = "Browser-based SSH/Telnet terminal manager — pytincture + wapyt"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.15"
authors = [{ name = "OldManGan", email = "eliguana@protonmail.com" }]
dependencies = [
    "paramiko>=3.4.0",
    "bcrypt>=4.1.0",
    "cryptography>=42.0.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
    "pytincture",
    "wapyt",
]

[project.urls]
homepage = "https://github.com/El-Iguana/iguanaxterm"

[tool.pytest.ini_options]
# tests/smoke needs a container, a running service and playwright, so it is not
# part of the default run. Its file is named to avoid collection too, belt and
# braces — see tests/smoke/README.md.
testpaths = ["tests"]
norecursedirs = ["smoke"]

[dependency-groups]
dev = [
    "pyftpdlib>=2.2.0",
    "pyopenssl>=26.4.0",
    "pytest>=8.0",
]

[tool.uv.sources]
# From git, pinned to the release tag this app was verified against, so a
# fresh clone builds without a sibling checkout (keep requirements.txt in
# step). To work on pytincture itself, override locally:
#   uv add --editable ../pytincture
pytincture = { git = "https://github.com/pytincture/pytincture.git", tag = "v1.0.0rc13" }
# Server-side only, for widgetset discovery: pytincture AST-walks the app's
# imports and reads __widgetset__ from the installed distribution. The browser
# installs the dev wheel from appcode/ instead of this checkout.
# Not editable, so development installs what the image and the Windows bundle
# ship: a built wheel. (Before pytincture 1.0.0rc13, #379, it had to be: an
# editable install exposes only a .pth plus dist-info, discovery found no
# widgetset, and the app booted with no widgets, silently.) Re-run
# `uv sync --reinstall-package wapyt` after changing wapyt's Python wrappers;
# asset edits go through scripts/dev_wheel.sh instead.
wapyt = { path = "../wa_pytincture_widgetset", editable = false }

[tool.setuptools]
py-modules = ["service"]
